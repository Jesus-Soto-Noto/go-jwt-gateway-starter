name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet & Test
        run: |
          go vet ./...
          go test -v -race ./...
      - name: Build Gateway Binary
        run: go build -v ./cmd/gateway
